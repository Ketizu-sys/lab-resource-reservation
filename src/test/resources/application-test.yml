spring:
  # 连接地址由 Testcontainers 在运行时动态注入。
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # LocalDateTime 必须原样写入 DATETIME；UTC 只用于 Instant 与数据库会话。
        type:
          java_time_use_direct_jdbc: true
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: SET time_zone = '+00:00'
  # 表结构只由 Liquibase 创建；test context 不加载开发演示数据。
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: test

  cache:
    type: redis

logging:
  # 默认保持简洁，需要排查 SQL 时可临时提高日志级别。
  level:
    org.springframework: INFO
    org.hibernate.SQL: INFO

reservation:
  time-zone: Asia/Shanghai
  queue:
    backend: redis
  # 集成测试直接控制队列消费时机，禁止后台定时线程抢先处理测试消息。
  scheduling:
    enabled: false

security:
  # 仅用于自动化测试，生产环境必须通过 JWT_SECRET 提供独立随机密钥。
  jwt:
    secret: test-only-jwt-secret-with-at-least-32-bytes
